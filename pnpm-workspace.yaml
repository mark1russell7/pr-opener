# The site of GitHub Pages is a private package of the workspace. The root is the extension.
packages:
  - "site"

# Packages allowed to run install scripts.
allowBuilds:
  esbuild: true

# Our own packages: the release age check of pnpm does not apply to them.
minimumReleaseAgeExclude:
  - "@mark1russell7/*"
  - "@procedures/*"

# An install fails when a new version has less trust evidence than an earlier version of the same package: for
# example, a version with no provenance after versions from a trusted publisher. Such a version can be a stolen token.
trustPolicy: no-downgrade
# The check examines the versions of the last 7 days. A stolen-token version is new, and the registry removes it in
# hours. Older versions can have less evidence for other reasons: for example undici-types 6.21.0 under @types/node.
trustPolicyIgnoreAfter: 10080

# pnpm cannot use the trust evidence of our own scopes: it ranks the first versions, which were staged by hand,
# above the versions from release.yml (pnpm/pnpm#16689).
trustPolicyExclude:
  - "@mark1russell7/*"
  - "@procedures/*"
