# The CI of this repository: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template,
# its CI.md). The job runs each standard script that package.json has: typecheck, test and build.
# The scheduled run of pages.yml reads this workflow (the green-main step).
name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@4466542421ef76bcb3ccf5b5e1765d4f509f8f4f # main
    permissions:
      contents: read
